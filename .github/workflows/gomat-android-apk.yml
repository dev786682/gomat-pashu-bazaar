name: Gomat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gomat-android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android WebView app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/gomat/pashubazaar
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'GomatPashuBazaar'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.9.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.gomat.pashubazaar'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.gomat.pashubazaar'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="गोमत पशु बाजार" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar"> <activity android:name=".MainActivity" android:exported="true"> <intent-filter> <action android:name="android.intent.action.MAIN" /> <category android:name="android.intent.category.LAUNCHER" /> </intent-filter> </activity> </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/gomat/pashubazaar/MainActivity.java <<'EOF'
          package com.gomat.pashubazaar;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView browser;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_REQUEST = 1001;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  browser = new WebView(this);
                  setContentView(browser);
                  WebSettings settings = browser.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  browser.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); }
                          catch (Exception ignored) { }
                          return true;
                      }
                  });
                  browser.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQUEST);
                              return true;
                          } catch (Exception ex) {
                              fileCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                      }
                  });
                  browser.loadUrl("https://dev786682.github.io/gomat-pashu-bazaar/");
              }

              @Override protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);
                  if (request == FILE_REQUEST && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result, data));
                      fileCallback = null;
                  }
              }

              @Override public void onBackPressed() {
                  if (browser != null && browser.canGoBack()) browser.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gomat-Pashu-Bazaar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

          
